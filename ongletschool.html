<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes outils ENSSAT</title>

<!-- Font Awesome en version SVG : les icônes sont dessinées directement,
     sans police à télécharger (plus fiable dans un bloc Notion) -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>

<style>
  /* ===== Palette (exclusive) ===== */
  :root {
    --creme:   #f5efe6;
    --lin:     #D5CABC;
    --rose:    #E8D5CC;
    --taupe:   #BDA18A;
    --caramel: #C49D83;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--creme); }

  body {
    padding: 12px;
    container-type: inline-size;   /* la mise en page suit la largeur du bloc Notion */
  }

  /* Une seule ligne qui occupe toute la largeur... */
  .wrapper {
    display: grid;
    grid-template-columns: repeat(var(--count, 5), 1fr);
    gap: clamp(8px, 1.6cqi, 18px);
    padding: 2px 7px 9px 2px;      /* laisse de la place à l'ombre */
  }

  /* ...et deux lignes quand le bloc est étroit (seulement s'il y a beaucoup de liens) */
  @container (max-width: 520px) {
    .wrapper { grid-template-columns: repeat(var(--half, 5), 1fr); }
  }

  .social {
    width: 100%;
    aspect-ratio: 1;               /* toujours carré, quelle que soit la largeur */
    display: grid;
    place-items: center;
    color: var(--caramel);
    background: var(--creme);
    border: 2px solid var(--taupe);
    border-radius: 10px;
    text-decoration: none;
    box-shadow: 5px 5px 0 var(--rose);   /* ombre décalée, toujours sous le bouton */
    transition: color .2s, background .2s, border-color .2s, box-shadow .2s, transform .2s;
  }

  .social svg { width: 42%; height: auto; }   /* l'icône grandit avec le bouton */

  .social:hover,
  .social:focus-visible {
    color: var(--creme);
    background: var(--caramel);
    border-color: var(--caramel);
    box-shadow: 0 0 0 var(--caramel);
    transform: translate(2px, 2px);
  }
  .social:active { transform: translate(2px, 2px) scale(.94); }
  .social:focus-visible { outline: 2px solid var(--taupe); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .social { transition: none; }
  }
</style>
</head>

<body>
  <nav class="wrapper" id="links" aria-label="Mes outils ENSSAT"></nav>

  <script>
    // ===== Tes liens : modifie, ajoute, supprime ou réordonne ici =====
    const LINKS = [
      { name: "ENT Rennes",        icon: "fa-solid fa-graduation-cap", url: "https://ent.univ-rennes1.fr/f/bureau/normal/render.uP" },
      { name: "Messagerie ENSSAT", icon: "fa-solid fa-envelope",       url: "https://messagerie.enssat.fr/" },
      { name: "Intranet ENSSAT",   icon: "fa-solid fa-network-wired",  url: "https://intranet.enssat.fr/apps/scolarite/trombi/trombi.php" },
      { name: "Site ENSSAT",       icon: "fa-solid fa-globe",          url: "https://www.enssat.fr/" },
      { name: "ChatGPT",           icon: "fa-solid fa-robot",          url: "https://chatgpt.com/" },
    ];

    // "_blank" = nouvel onglet ; "_top" = remplace la page Notion
    const TARGET = "_blank";

    const nav = document.getElementById("links");
    // Le nombre de colonnes suit le nombre de liens ; on ne coupe en deux
    // lignes que s'il y en a plus de 6
    nav.style.setProperty("--count", LINKS.length);
    nav.style.setProperty("--half", LINKS.length > 6 ? Math.ceil(LINKS.length / 2) : LINKS.length);
    nav.replaceChildren(...LINKS.map(({ name, icon, url }) => {
      const a = document.createElement("a");
      a.className = "social";
      a.href = url;
      a.target = TARGET;
      a.rel = "noopener noreferrer";
      a.title = name;
      a.setAttribute("aria-label", name);
      const i = document.createElement("i");
      i.className = icon;
      i.setAttribute("aria-hidden", "true");
      a.appendChild(i);
      return a;
    }));
  </script>
</body>
</html>
