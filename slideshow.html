<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slideshow</title>
<style>
  /* ===== Palette (exclusive) ===== */
  :root {
    --creme:   #f5efe6;
    --lin:     #D5CABC;
    --rose:    #E8D5CC;
    --taupe:   #BDA18A;
    --caramel: #C49D83;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Le diaporama remplit tout le bloc Notion, quelle que soit sa taille */
  html, body { height: 100%; background: var(--creme); }

  .slider {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 180px;
    overflow: hidden;
    border-radius: 14px;
    background: var(--rose);
    outline: none;
    touch-action: pan-y;
  }
  .slider:focus-visible { box-shadow: inset 0 0 0 3px var(--caramel); }

  .slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    opacity: 0;
    transition: opacity .6s ease;
    user-select: none;
    -webkit-user-drag: none;
  }
  .slide.current { opacity: 1; }

  /* ----- Flèches ----- */
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: clamp(34px, 6vw, 46px);
    height: clamp(34px, 6vw, 46px);
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid var(--creme);
    background: var(--creme);
    color: var(--caramel);
    cursor: pointer;
    opacity: .9;
    transition: background .2s, color .2s, opacity .2s;
  }
  .nav:hover, .nav:focus-visible {
    background: var(--caramel);
    border-color: var(--caramel);
    color: var(--creme);
    opacity: 1;
  }
  .nav:focus-visible { outline: 2px solid var(--creme); outline-offset: 2px; }
  .nav svg { width: 45%; height: 45%; }
  .prev { left: 12px; }
  .next { right: 12px; }

  /* ----- Points ----- */
  .dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 7px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--creme);
  }
  .dot {
    width: 9px;
    height: 9px;
    padding: 0;
    border: none;
    border-radius: 999px;
    background: var(--lin);
    cursor: pointer;
    transition: width .25s, background .25s;
  }
  .dot[aria-current="true"] { width: 22px; background: var(--caramel); }
  .dot:focus-visible { outline: 2px solid var(--caramel); outline-offset: 2px; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .slide, .dot, .nav { transition: none; }
  }
</style>
</head>
<body>

<div class="slider" id="slider" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Slideshow">
  <button class="nav prev" id="prev" type="button" aria-label="Previous image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="nav next" id="next" type="button" aria-label="Next image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="dots" id="dots" role="group" aria-label="Choose an image"></div>
</div>

<script>
(() => {
  // ===== Réglages =====
  // Mets ici les noms de tes images (dans le même dossier GitHub que ce fichier).
  // Les images introuvables sont ignorées automatiquement.
  const IMAGES = [
    "slideshow1.png",
    "slideshow2.png",
    "slideshow3.png",
    "slideshow4.png",
    "slideshow5.png",
    "slideshow6.png",
  ];
  const AUTOPLAY = true;
  const INTERVAL = 5000;   // en millisecondes

  const slider = document.getElementById("slider");
  const dotsEl = document.getElementById("dots");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let slides = [], dots = [], index = 0, timer = null, paused = false;

  // On ne garde que les images qui se chargent vraiment
  const check = (src) => new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(src);
    img.onerror = () => resolve(null);
    img.src = src;
  });

  Promise.all(IMAGES.map(check)).then((found) => {
    const valid = found.filter(Boolean);

    valid.forEach((src, i) => {
      const img = document.createElement("img");
      img.className = "slide" + (i === 0 ? " current" : "");
      img.src = src;
      img.alt = `Image ${i + 1} of ${valid.length}`;
      img.draggable = false;
      slider.insertBefore(img, prevBtn);
      slides.push(img);

      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = "dot";
      dot.setAttribute("aria-label", `Image ${i + 1}`);
      dot.addEventListener("click", () => { show(i); restart(); });
      dotsEl.appendChild(dot);
      dots.push(dot);
    });

    const single = valid.length < 2;
    prevBtn.hidden = nextBtn.hidden = dotsEl.hidden = single;
    show(0);
    restart();
  });

  function show(i) {
    if (!slides.length) return;
    index = (i + slides.length) % slides.length;
    slides.forEach((s, k) => s.classList.toggle("current", k === index));
    dots.forEach((d, k) => d.setAttribute("aria-current", String(k === index)));
  }
  const next = () => show(index + 1);
  const prev = () => show(index - 1);

  function restart() {
    clearInterval(timer);
    if (AUTOPLAY && !reduceMotion && !paused && slides.length > 1) {
      timer = setInterval(next, INTERVAL);
    }
  }
  function setPaused(p) { paused = p; restart(); }

  prevBtn.addEventListener("click", () => { prev(); restart(); });
  nextBtn.addEventListener("click", () => { next(); restart(); });

  // Pause au survol, au focus, et quand l'onglet n'est pas visible
  slider.addEventListener("mouseenter", () => setPaused(true));
  slider.addEventListener("mouseleave", () => setPaused(false));
  slider.addEventListener("focusin", () => setPaused(true));
  slider.addEventListener("focusout", () => setPaused(false));
  document.addEventListener("visibilitychange", () => setPaused(document.hidden));

  // Clavier : flèches gauche / droite
  slider.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft")  { e.preventDefault(); prev(); restart(); }
    if (e.key === "ArrowRight") { e.preventDefault(); next(); restart(); }
  });

  // Glisser du doigt (mobile) ou de la souris
  let startX = null;
  slider.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    startX = e.clientX;
  });
  slider.addEventListener("pointerup", (e) => {
    if (startX === null) return;
    const dx = e.clientX - startX;
    startX = null;
    if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); restart(); }
  });
  slider.addEventListener("pointercancel", () => { startX = null; });
})();
</script>
</body>
</html>
