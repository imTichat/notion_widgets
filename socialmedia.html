<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Socials</title>

<!-- Font Awesome en version SVG : les icônes sont dessinées directement,
     sans police à télécharger (plus fiable dans un bloc Notion) -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>

<style>
  /* ===== Palette (exclusive) ===== */
  :root {
    --creme:   #f5efe6;
    --lin:     #D5CABC;
    --rose:    #E8D5CC;
    --taupe:   #BDA18A;
    --caramel: #C49D83;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: var(--creme); }

  body {
    padding: 12px;
    container-type: inline-size;   /* la mise en page suit la largeur du bloc Notion */
  }

  /* Une seule ligne qui occupe toute la largeur... */
  .wrapper {
    display: grid;
    grid-template-columns: repeat(var(--count, 10), 1fr);
    gap: clamp(8px, 1.6cqi, 18px);
    padding: 2px 7px 9px 2px;      /* laisse de la place à l'ombre */
  }

  /* ...et deux lignes égales quand le bloc est étroit */
  @container (max-width: 520px) {
    .wrapper { grid-template-columns: repeat(var(--half, 5), 1fr); }
  }

  .social {
    width: 100%;
    aspect-ratio: 1;               /* toujours carré, quelle que soit la largeur */
    display: grid;
    place-items: center;
    color: var(--caramel);
    background: var(--creme);
    border: 2px solid var(--taupe);
    border-radius: 10px;
    text-decoration: none;
    /* Ombre décalée, toujours SOUS le bouton */
    box-shadow: 5px 5px 0 var(--rose);
    transition: color .2s, background .2s, border-color .2s, box-shadow .2s, transform .2s;
  }

  .social svg { width: 42%; height: auto; }   /* l'icône grandit avec le bouton */

  /* Au survol : l'ombre se replace sous le bouton, qui passe en caramel */
  .social:hover,
  .social:focus-visible {
    color: var(--creme);
    background: var(--caramel);
    border-color: var(--caramel);
    box-shadow: 0 0 0 var(--caramel);
    transform: translate(2px, 2px);
  }
  .social:active { transform: translate(2px, 2px) scale(.94); }
  .social:focus-visible { outline: 2px solid var(--taupe); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .social { transition: none; }
  }
</style>
</head>

<body>
  <nav class="wrapper" id="socials" aria-label="My links"></nav>

  <script>
    // ===== Tes liens : modifie, ajoute, supprime ou réordonne ici =====
    const LINKS = [
      { name: "Canva",     icon: "fa-solid fa-palette",    url: "https://www.canva.com/" },
      { name: "Email",     icon: "fa-solid fa-envelope",   url: "https://mail.google.com/mail/u/0/#inbox" },
      { name: "Facebook",  icon: "fa-brands fa-facebook",  url: "https://www.facebook.com/" },
      { name: "Instagram", icon: "fa-brands fa-instagram", url: "https://www.instagram.com/" },
      { name: "LinkedIn",  icon: "fa-brands fa-linkedin",  url: "https://www.linkedin.com/in/laetitia-ye-12f07m/" },
      { name: "X",         icon: "fa-brands fa-x-twitter", url: "https://x.com/home" },
      { name: "TikTok",    icon: "fa-brands fa-tiktok",    url: "https://www.tiktok.com/discover?lang=fr" },
      { name: "YouTube",   icon: "fa-brands fa-youtube",   url: "https://www.youtube.com/" },
      { name: "Pinterest", icon: "fa-brands fa-pinterest", url: "https://www.pinterest.fr/" },
      { name: "GitHub",    icon: "fa-brands fa-github",    url: "https://github.com/imTichat/notion_widgets" },
    ];

    // "_blank" = nouvel onglet ; "_top" = remplace la page Notion
    const TARGET = "_blank";

    const nav = document.getElementById("socials");
    // Le nombre de colonnes suit automatiquement le nombre de liens
    nav.style.setProperty("--count", LINKS.length);
    nav.style.setProperty("--half", Math.ceil(LINKS.length / 2));
    nav.replaceChildren(...LINKS.map(({ name, icon, url }) => {
      const a = document.createElement("a");
      a.className = "social";
      a.href = url;
      a.target = TARGET;
      a.rel = "noopener noreferrer";
      a.title = name;
      a.setAttribute("aria-label", name);
      const i = document.createElement("i");
      i.className = icon;
      i.setAttribute("aria-hidden", "true");
      a.appendChild(i);
      return a;
    }));
  </script>
</body>
</html>
